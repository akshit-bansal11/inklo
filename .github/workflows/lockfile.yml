# Resolves Cargo.lock on a runner. Nothing is built on the maintainer's machine, so any change to a
# Cargo.toml is followed by running this on the branch and committing the uploaded Cargo.lock.
name: lockfile
on:
  workflow_dispatch:
  # Also on any branch push that changes a manifest, so a new branch can get its lock before
  # this workflow exists on main (dispatch only sees workflows on the default branch).
  push:
    branches-ignore: [main]
    paths: ["**/Cargo.toml", ".github/workflows/lockfile.yml"]
permissions:
  contents: read
jobs:
  lock:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - run: cargo update --workspace
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Cargo.lock
          path: Cargo.lock
